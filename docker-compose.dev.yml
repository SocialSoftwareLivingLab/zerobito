services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: zerobito-frontend-dev
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:3001
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    stdin_open: true

volumes:
  node_modules:
