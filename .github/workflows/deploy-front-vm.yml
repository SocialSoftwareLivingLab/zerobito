name: Build e Deploy Frontend - teste

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # 🔥 ESSENCIAL para GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Definir nome da imagem
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER=$OWNER" >> $GITHUB_ENV

      - name: Build da imagem do frontend
        run: |
          docker build -t ghcr.io/$OWNER/zerobito-frontend:latest .

      - name: Push para GHCR
        run: |
          docker push ghcr.io/$OWNER/zerobito-frontend:latest

      - name: Deploy na VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT }}
          script: |
            cd /opt/apps/frontend
            sudo docker compose pull
            sudo docker compose up -d --force-recreate